name: Build Pancito y Más Android APK

# Runs automatically on every push to main, or manually from the Actions tab
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # ── 1. Get the code ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Runtime setup ─────────────────────────────────────────────────────
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 17  (required by Android Gradle Plugin 8)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Install Capacitor + plugins ───────────────────────────────────────
      - name: Install npm dependencies
        run: npm install

      # ── 4. Bundle web assets into www/ (Capacitor webDir) ───────────────────
      - name: Prepare www directory with web assets
        run: |
          mkdir -p www
          cp *.html www/ 2>/dev/null || true
          cp *.js   www/ 2>/dev/null || true
          cp *.css  www/ 2>/dev/null || true
          cp *.jpg  www/ 2>/dev/null || true
          cp *.png  www/ 2>/dev/null || true
          cp -r Images www/ 2>/dev/null || true

      # ── 5. Generate the Android project ──────────────────────────────────────
      - name: Add Android platform
        run: npx cap add android

      # ── 6. Copy web assets into the Android project ──────────────────────────
      - name: Sync web assets to Android
        run: npx cap sync android

      # ── 6a. Patch notification plugin to use STREAM_ALARM audio stream ───────
      # Patching AFTER cap sync so we get the final copy of ChannelManager.java
      # that was written into the android/ project during sync.
      # This makes timers ring even when the phone is set to vibrate-only,
      # exactly like the built-in Clock/Alarm app does.
      - name: Patch LocalNotifications to use alarm audio stream
        run: |
          # Replace the audio stream so the timer notification rings even on vibrate.
          # MUST replace _RINGTONE first to avoid creating an invalid
          # USAGE_ALARM_RINGTONE token (which would break the Java build).
          ANDROID_FILE=$(find android -name "ChannelManager.java" 2>/dev/null | head -1)
          if [ -n "$ANDROID_FILE" ]; then
            echo "Found android copy: $ANDROID_FILE"
            echo "── BEFORE: $(grep -n 'USAGE_' "$ANDROID_FILE" || echo 'no USAGE_ matches')"
            sed -i 's/AudioAttributes\.USAGE_NOTIFICATION_RINGTONE/AudioAttributes.USAGE_ALARM/g' "$ANDROID_FILE" || true
            sed -i 's/AudioAttributes\.USAGE_NOTIFICATION\b/AudioAttributes.USAGE_ALARM/g' "$ANDROID_FILE" || true
            echo "── AFTER:  $(grep -n 'USAGE_' "$ANDROID_FILE" || echo 'no USAGE_ matches')"
          else
            echo "WARNING: ChannelManager.java not found in android/"
          fi
          NM_FILE=$(find node_modules/@capacitor/local-notifications -name "ChannelManager.java" 2>/dev/null | head -1)
          if [ -n "$NM_FILE" ]; then
            echo "Found node_modules copy: $NM_FILE"
            echo "── BEFORE: $(grep -n 'USAGE_' "$NM_FILE" || echo 'no USAGE_ matches')"
            sed -i 's/AudioAttributes\.USAGE_NOTIFICATION_RINGTONE/AudioAttributes.USAGE_ALARM/g' "$NM_FILE" || true
            sed -i 's/AudioAttributes\.USAGE_NOTIFICATION\b/AudioAttributes.USAGE_ALARM/g' "$NM_FILE" || true
            echo "── AFTER:  $(grep -n 'USAGE_' "$NM_FILE" || echo 'no USAGE_ matches')"
          fi
          # Always exit 0 — even if no file found, build can proceed with the (cached) channel
          exit 0

      # ── 6a-bis. Patch scheduling to use setAlarmClock() ──────────────────────
      # setExactAndAllowWhileIdle gets deferred by App Standby on idle apps —
      # 30/60-min timers fail to fire until the app is foregrounded again.
      # setAlarmClock is the API the system Clock app uses; bypasses Doze,
      # App Standby, AND manufacturer battery optimizations.
      - name: Patch LocalNotifications to use setAlarmClock
        run: |
          patch_lnm() {
            local f="$1"
            echo "── BEFORE ($f):"
            grep -nE 'setExact|setAlarmClock' "$f" || echo "  (no setExact/setAlarmClock matches)"
            # setExactAndAllowWhileIdle(type, time, pi)  →  setAlarmClock(new AlarmClockInfo(time, pi), pi)
            sed -E -i 's/alarmManager\.setExactAndAllowWhileIdle\([^,]+,[[:space:]]*([^,]+),[[:space:]]*([^)]+)\)/alarmManager.setAlarmClock(new AlarmManager.AlarmClockInfo(\1, \2), \2)/g' "$f" || true
            # setExact(type, time, pi)  →  setAlarmClock(...)
            sed -E -i 's/alarmManager\.setExact\([^,]+,[[:space:]]*([^,]+),[[:space:]]*([^)]+)\)/alarmManager.setAlarmClock(new AlarmManager.AlarmClockInfo(\1, \2), \2)/g' "$f" || true
            echo "── AFTER ($f):"
            grep -nE 'setExact|setAlarmClock' "$f" || echo "  (no setExact/setAlarmClock matches)"
          }
          LNM_NM=$(find node_modules/@capacitor/local-notifications -name "LocalNotificationManager.java" 2>/dev/null | head -1)
          if [ -n "$LNM_NM" ]; then
            echo "Found node_modules copy: $LNM_NM"
            patch_lnm "$LNM_NM"
          fi
          LNM_AND=$(find android -name "LocalNotificationManager.java" 2>/dev/null | head -1)
          if [ -n "$LNM_AND" ]; then
            echo "Found android copy: $LNM_AND"
            patch_lnm "$LNM_AND"
          fi
          exit 0

      # ── 6b. Add exact-alarm & battery-exemption permissions to AndroidManifest ─
      # USE_EXACT_ALARM  → Android 13+: granted automatically at install, no user prompt
      # SCHEDULE_EXACT_ALARM → Android 12: user grants once in Settings → Alarms & Reminders
      # REQUEST_IGNORE_BATTERY_OPTIMIZATIONS → lets app ask to be exempt from battery saver
      # RECEIVE_BOOT_COMPLETED + WAKE_LOCK → restore alarms after reboot, wake CPU to fire them
      # Using Python instead of sed to avoid \n escaping issues on different GNU sed versions.
      - name: Add alarm permissions to AndroidManifest
        run: |
          python3 << 'PYEOF'
          import sys
          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path, 'r') as f:
              content = f.read()
          if 'USE_EXACT_ALARM' in content:
              print('✓ Permissions already present — skipping')
              sys.exit(0)
          perms = (
              '    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n'
              '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n'
              '    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />\n'
              '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n'
              '    <uses-permission android:name="android.permission.WAKE_LOCK" />\n'
          )
          if '</manifest>' not in content:
              print('ERROR: </manifest> tag not found!', file=sys.stderr)
              sys.exit(1)
          content = content.replace('</manifest>', perms + '</manifest>')
          with open(path, 'w') as f:
              f.write(content)
          print('✓ Permissions injected')
          PYEOF
          echo "✓ Final manifest permissions:"
          grep "uses-permission" android/app/src/main/AndroidManifest.xml || echo "ERROR: no permissions found!"

      # ── 7. Install Android SDK components and accept licenses ────────────────
      - name: Install Android SDK components and accept licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

      # ── 8. Write local.properties so Gradle finds the Android SDK ────────────
      - name: Create android/local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      # ── 9. Build the APK ─────────────────────────────────────────────────────
      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # ── 10. Save the APK so you can download it ──────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pancito-mas-android-v${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 60
