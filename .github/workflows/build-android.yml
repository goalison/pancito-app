name: Build Pancito y Más Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # secrets.* cannot be referenced directly in a step's `if:` condition
      # (GitHub Actions rejects the whole workflow file at validation time —
      # "Unrecognized named-value: 'secrets'" — every run failed outright
      # until this was mapped to a job-level env var instead).
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

    steps:
      # ── 1. Get the code ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Runtime setup ───────────────────────────────────────────────────
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 17 (required by Android Gradle Plugin 8)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Install Capacitor + plugins ─────────────────────────────────────
      - name: Install npm dependencies
        run: npm install

      # ── 4. Bundle web assets into www/ (Capacitor webDir) ──────────────────
      - name: Prepare www directory with web assets
        run: |
          mkdir -p www
          cp *.html www/ 2>/dev/null || true
          cp *.js   www/ 2>/dev/null || true
          cp *.css  www/ 2>/dev/null || true
          cp *.jpg  www/ 2>/dev/null || true
          cp *.png  www/ 2>/dev/null || true
          cp -r Images www/ 2>/dev/null || true

      # ── 5. Generate the Android project ────────────────────────────────────
      - name: Add Android platform
        run: npx cap add android

      # ── 6. Copy web assets into the Android project ────────────────────────
      - name: Sync web assets to Android
        run: npx cap sync android

      # ── 6a. Patch LocalNotifications to ring on the ALARM audio stream ─────
      - name: Patch LocalNotifications to ring on the ALARM audio stream
        run: |
          REPLACEMENT='notificationChannel.setSound(android.media.RingtoneManager.getDefaultUri(android.media.RingtoneManager.TYPE_ALARM), new android.media.AudioAttributes.Builder().setContentType(android.media.AudioAttributes.CONTENT_TYPE_SONIFICATION).setUsage(android.media.AudioAttributes.USAGE_ALARM).build()); notificationManager.createNotificationChannel(notificationChannel);'
          patch_file() {
            local f="$1"
            echo "── BEFORE ($f):"
            grep -nE 'createNotificationChannel|setSound' "$f" || echo " (no matches)"
            if grep -q 'TYPE_ALARM' "$f"; then
              echo " (already patched, skipping)"
              return
            fi
            sed -i "s|notificationManager\.createNotificationChannel(notificationChannel);|$REPLACEMENT|g" "$f"
            echo "── AFTER ($f):"
            grep -nE 'createNotificationChannel|setSound|TYPE_ALARM' "$f" || echo " (no matches)"
          }
          PATCHED=0
          NM_FILE=$(find node_modules/@capacitor/local-notifications -name "NotificationChannelManager.java" 2>/dev/null | head -1)
          if [ -n "$NM_FILE" ]; then patch_file "$NM_FILE"; PATCHED=1; fi
          ANDROID_FILE=$(find android -name "NotificationChannelManager.java" 2>/dev/null | head -1)
          if [ -n "$ANDROID_FILE" ]; then patch_file "$ANDROID_FILE"; PATCHED=1; fi
          if [ "$PATCHED" = "0" ]; then
            echo "ERROR: NotificationChannelManager.java not found anywhere"
            exit 1
          fi

      # ── 6b. Patch LocalNotifications to use setAlarmClock ──────────────────
      # setAlarmClock is the ONLY AlarmManager API that bypasses Doze + App
      # Standby for alarms more than ~10 min out. All other methods
      # (set, setExact, setAndAllowWhileIdle, setExactAndAllowWhileIdle) get
      # deferred until the next maintenance window or app foreground — which
      # is the "all alarms fire when I open the app" symptom.
      - name: Patch LocalNotifications to use setAlarmClock
        run: |
          patch_lnm() {
            local f="$1"
            echo "── BEFORE ($f):"
            grep -nE 'alarmManager\.(set|setExact|setAndAllowWhileIdle|setExactAndAllowWhileIdle|setAlarmClock)\(' "$f" || echo "  (no scheduling calls found)"
            # Order matters: longest method names FIRST so shorter ones don't false-match the prefix.
            sed -E -i 's/alarmManager\.setExactAndAllowWhileIdle\([^,]+,[[:space:]]*([^,]+),[[:space:]]*([^)]+)\)/alarmManager.setAlarmClock(new AlarmManager.AlarmClockInfo(\1, null), \2)/g' "$f"
            sed -E -i 's/alarmManager\.setAndAllowWhileIdle\([^,]+,[[:space:]]*([^,]+),[[:space:]]*([^)]+)\)/alarmManager.setAlarmClock(new AlarmManager.AlarmClockInfo(\1, null), \2)/g' "$f"
            sed -E -i 's/alarmManager\.setExact\([^,]+,[[:space:]]*([^,]+),[[:space:]]*([^)]+)\)/alarmManager.setAlarmClock(new AlarmManager.AlarmClockInfo(\1, null), \2)/g' "$f"
            sed -E -i 's/alarmManager\.set\(AlarmManager\.[A-Z_]+,[[:space:]]*([^,]+),[[:space:]]*([^)]+)\)/alarmManager.setAlarmClock(new AlarmManager.AlarmClockInfo(\1, null), \2)/g' "$f"
            echo "── AFTER ($f):"
            grep -nE 'alarmManager\.(set|setExact|setAndAllowWhileIdle|setExactAndAllowWhileIdle|setAlarmClock)\(' "$f" || echo "  (no scheduling calls found)"
          }
          LNM_NM=$(find node_modules/@capacitor/local-notifications -name "LocalNotificationManager.java" 2>/dev/null | head -1)
          if [ -n "$LNM_NM" ]; then echo "Found node_modules copy: $LNM_NM"; patch_lnm "$LNM_NM"; fi
          LNM_AND=$(find android -name "LocalNotificationManager.java" 2>/dev/null | head -1)
          if [ -n "$LNM_AND" ]; then echo "Found android copy: $LNM_AND"; patch_lnm "$LNM_AND"; fi

          # ── HARD ASSERTION ──────────────────────────────────────────────────
          # At least one file must contain setAlarmClock AND must NOT contain any
          # deferred-by-Doze method. If either fails, the patch did not match the
          # source (e.g. Capacitor changed the formatting). Fail the build loudly
          # instead of shipping an APK that LOOKS patched but isn't.
          PATCHED_ANY=0
          for f in "$LNM_NM" "$LNM_AND"; do
            [ -z "$f" ] && continue
            if grep -qE 'alarmManager\.(set|setExact|setAndAllowWhileIdle|setExactAndAllowWhileIdle)\(' "$f"; then
              echo "ERROR: $f still contains a Doze-deferrable scheduling call:"
              grep -nE 'alarmManager\.(set|setExact|setAndAllowWhileIdle|setExactAndAllowWhileIdle)\(' "$f"
              exit 1
            fi
            if ! grep -q 'alarmManager\.setAlarmClock(' "$f"; then
              echo "ERROR: $f has no setAlarmClock() — patch did not apply"
              exit 1
            fi
            echo "✓ $f: only setAlarmClock remains"
            PATCHED_ANY=1
          done
          if [ "$PATCHED_ANY" = "0" ]; then
            echo "ERROR: no LocalNotificationManager.java found anywhere — patch step ran against nothing"
            exit 1
          fi

      # ── 6c. Add alarm permissions to AndroidManifest ───────────────────────
      - name: Add alarm permissions to AndroidManifest
        run: |
          python3 << 'PYEOF'
          import sys, os
          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path, 'r') as f:
            content = f.read()
          if 'USE_EXACT_ALARM' in content:
            print('✓ Permissions already present — skipping')
            sys.exit(0)
          perms = (
            '    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n'
            '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n'
            '    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />\n'
            '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n'
            '    <uses-permission android:name="android.permission.WAKE_LOCK" />\n'
          )
          content = content.replace('</manifest>', perms + '</manifest>')
          vc = os.environ.get('GITHUB_RUN_NUMBER', '137')
          with open(path, 'w') as f:
            f.write(content.replace('targetSdkVersion 34', 'targetSdkVersion 35').replace('targetSdk 34', 'targetSdk 35').replace('compileSdkVersion 34', 'compileSdkVersion 35').replace('versionCode 1', 'versionCode ' + vc))
          print('✓ Permissions injected')
          PYEOF

      # ── 6d. Patch MainActivity to request battery-optimization exemption ───
      - name: Patch MainActivity to request battery-optimization exemption
        run: |
          MAIN=$(find android -name MainActivity.java 2>/dev/null | head -1)
          if [ -z "$MAIN" ]; then
            echo "ERROR: MainActivity.java not found under android/"
            exit 1
          fi
          echo "Patching: $MAIN"
          if grep -q 'requestBatteryOptimizationExemption' "$MAIN"; then
            echo "✓ Already patched — skipping"
            exit 0
          fi
          PKG=$(grep -E '^package ' "$MAIN" | head -1)
          if [ -z "$PKG" ]; then
            echo "ERROR: no package declaration in $MAIN"
            exit 1
          fi
          cat > "$MAIN" <<JAVA_EOF
          $PKG

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.PowerManager;
          import android.provider.Settings;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestBatteryOptimizationExemption();
              }

              private void requestBatteryOptimizationExemption() {
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          String packageName = getPackageName();
                          PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                          if (pm != null && !pm.isIgnoringBatteryOptimizations(packageName)) {
                              Intent intent = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                              intent.setData(Uri.parse("package:" + packageName));
                              intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(intent);
                          }
                      }
                  } catch (Exception e) {
                      // best-effort — never crash the app over this
                  }
              }
          }
          JAVA_EOF
          echo "✓ MainActivity patched"
          echo "── Result:"
          cat "$MAIN"

      # ── 6e. Configure Android Auto Backup for Apps ──────────────────────────
      # Backs up SharedPreferences (where @capacitor/preferences stores all
      # durable pym_* data — see storage.js) and the bake-photos/ files
      # (@capacitor/filesystem) to the user's Google account automatically,
      # restored on reinstall or a new device. This complements — does not
      # replace — the in-app manual "Export backup file" feature. The old
      # WebView database domain (localStorage/IndexedDB) is excluded since
      # it's no longer the source of truth for durable data.
      - name: Configure Android Auto Backup for Apps
        run: |
          mkdir -p android/app/src/main/res/xml

          cat > android/app/src/main/res/xml/backup_rules.xml << 'XML_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <full-backup-content>
              <include domain="sharedpref" path="."/>
              <include domain="file" path="bake-photos/"/>
              <exclude domain="database" path="."/>
          </full-backup-content>
          XML_EOF

          cat > android/app/src/main/res/xml/data_extraction_rules.xml << 'XML_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <data-extraction-rules>
              <cloud-backup>
                  <include domain="sharedpref" path="."/>
                  <include domain="file" path="bake-photos/"/>
                  <exclude domain="database" path="."/>
              </cloud-backup>
              <device-transfer>
                  <include domain="sharedpref" path="."/>
                  <include domain="file" path="bake-photos/"/>
                  <exclude domain="database" path="."/>
              </device-transfer>
          </data-extraction-rules>
          XML_EOF

          echo "✓ Backup rule XML files written"

          python3 << 'PYEOF'
          import re, sys
          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path, 'r') as f:
              content = f.read()

          m = re.search(r'<application\b[^>]*>', content)
          if not m:
              print('ERROR: <application> tag not found in AndroidManifest.xml')
              sys.exit(1)
          tag = m.group(0)

          def set_attr(t, name, value):
              pattern = r'android:' + name + r'="[^"]*"'
              if re.search(pattern, t):
                  return re.sub(pattern, 'android:' + name + '="' + value + '"', t)
              return t.replace('<application', '<application\n        android:' + name + '="' + value + '"', 1)

          new_tag = tag
          new_tag = set_attr(new_tag, 'allowBackup', 'true')
          new_tag = set_attr(new_tag, 'fullBackupContent', '@xml/backup_rules')
          new_tag = set_attr(new_tag, 'dataExtractionRules', '@xml/data_extraction_rules')

          content = content.replace(tag, new_tag, 1)
          with open(path, 'w') as f:
              f.write(content)
          print('✓ AndroidManifest <application> tag patched:')
          print(new_tag)
          PYEOF

          echo "── Verifying:"
          grep -q 'android:allowBackup="true"' android/app/src/main/AndroidManifest.xml || { echo "ERROR: allowBackup not set"; exit 1; }
          grep -q 'android:fullBackupContent="@xml/backup_rules"' android/app/src/main/AndroidManifest.xml || { echo "ERROR: fullBackupContent not set"; exit 1; }
          grep -q 'android:dataExtractionRules="@xml/data_extraction_rules"' android/app/src/main/AndroidManifest.xml || { echo "ERROR: dataExtractionRules not set"; exit 1; }
          [ -f android/app/src/main/res/xml/backup_rules.xml ] || { echo "ERROR: backup_rules.xml missing"; exit 1; }
          [ -f android/app/src/main/res/xml/data_extraction_rules.xml ] || { echo "ERROR: data_extraction_rules.xml missing"; exit 1; }
          echo "✓ Auto Backup configured and verified"

      # ── 7. Decode release keystore from secret ──────────────────────────────
      - name: Decode release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/pancitoymas-release.keystore
          echo "✓ Keystore decoded ($(wc -c < android/app/pancitoymas-release.keystore) bytes)"

      # ── 8. Inject release signing config into build.gradle ─────────────────
      - name: Inject release signing config into build.gradle
        run: |
          python3 << 'PYEOF'
          import os
          path = 'android/app/build.gradle'
          with open(path, 'r') as f:
            content = f.read()

          signing_config = """
              signingConfigs {
                  release {
                      storeFile file("pancitoymas-release.keystore")
                      storePassword System.getenv("STORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          """

          if 'signingConfigs' not in content:
              content = content.replace('    buildTypes {', signing_config + '    buildTypes {')

          if 'signingConfig signingConfigs.release' not in content:
              bt_pos = content.find('buildTypes {')
              if bt_pos != -1:
                  rel_pos = content.find('release {', bt_pos)
                  if rel_pos != -1:
                      insert_at = rel_pos + len('release {')
                      content = content[:insert_at] + '\n                signingConfig signingConfigs.release' + content[insert_at:]

          vc = os.environ.get('GITHUB_RUN_NUMBER', '137')
          with open(path, 'w') as f:
              f.write(content
                  .replace('targetSdkVersion 34', 'targetSdkVersion 35')
                  .replace('targetSdk 34', 'targetSdk 35')
                  .replace('compileSdkVersion 34', 'compileSdkVersion 35')
                  .replace('versionCode 1', 'versionCode ' + vc)
                  .replace('versionName "1.0"', 'versionName "1.0.' + vc + '"'))
          print('✓ Signing config injected into build.gradle')
          PYEOF

      # ── 9. Install Android SDK components and accept licenses ───────────────
      - name: Install Android SDK components and accept licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      # ── 10. Patch SDK versions in variables.gradle and create local.properties
      - name: Patch SDK versions in variables.gradle and create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          python3 << 'PYEOF'
          import re, glob
          targets = glob.glob('android/variables.gradle') + glob.glob('android/app/build.gradle')
          for path in targets:
            with open(path, 'r') as f:
              content = f.read()
            content = re.sub(r'((?:targetSdkVersion|compileSdkVersion|targetSdk|compileSdk)\s*=\s*)34', r'\g<1>35', content)
            content = content.replace('targetSdkVersion 34', 'targetSdkVersion 35')
            content = content.replace('compileSdkVersion 34', 'compileSdkVersion 35')
            content = content.replace('targetSdk 34', 'targetSdk 35')
            content = content.replace('compileSdk 34', 'compileSdk 35')
            with open(path, 'w') as f:
              f.write(content)
            print(f'✓ Patched {path}')
          PYEOF

      # ── 11. Build the RELEASE AAB ───────────────────────────────────────────
      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build release AAB
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      # ── 12. Save the release AAB ────────────────────────────────────────────
      - name: Upload release AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: pancito-mas-android-v${{ github.run_number }}-release
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 60

      # ── 13. Publish to Play Store (Internal testing track) ──────────────────
      # Skipped automatically until PLAY_SERVICE_ACCOUNT_JSON is configured as
      # a repo secret — see README.md § "Play Store publishing" for one-time
      # setup. Never targets production; promoting a release out of Internal
      # testing stays a manual step in Play Console on purpose. Release notes
      # come from distribution/whatsnew/<locale>/whatsnew — update those files
      # before pushing to change what's shown for the next release.
      - name: Publish to Play Store (Internal testing)
        if: ${{ env.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ env.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.pancitoymas.sourdough
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          whatsNewDirectory: distribution/whatsnew
          status: completed
